<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--br:#5b3a29;--go:#e8a920;--rd:#c8372d;--gr:#3f8f4f;--bl:#2f6fb0;--bg:#fbf6ee;--cd:#fff;--tx:#2d2118;--mu:#7a6a5d;--ln:#eadfce;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1f1812;--cd:#2b221a;--tx:#f3e9dc;--mu:#b9a998;--ln:#41352a}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;background-image:radial-gradient(circle at 100% 0,rgba(232,169,32,.12),transparent 40%),radial-gradient(circle at 0 100%,rgba(63,143,79,.09),transparent 40%)}
button,input,select{font:inherit;color:inherit}
.btn{background:var(--br);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}.btn.go{background:var(--go);color:#3a2616}.btn.rd{background:var(--rd)}.btn.gr{background:var(--gr)}.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--ln)}.btn.sm{padding:5px 10px;font-size:13px}
input,select{background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:9px 11px;min-width:0}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px rgba(91,58,41,.06)}
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.lbox{width:100%;max-width:380px;text-align:center}.lbox input{width:100%;margin:6px 0}
.logo{display:inline-flex;align-items:center;justify-content:center;width:76px;height:76px;border-radius:50%;background:var(--go);color:var(--br);font-weight:800;font-size:26px;border:4px solid var(--br);margin-bottom:8px}
h1,h2,h3{margin:0 0 10px;color:var(--br)}@media(prefers-color-scheme:dark){h1,h2,h3{color:var(--go)}}
.biglogo{width:100%;max-width:340px;height:auto;display:block;margin:0 auto 10px}.tag{color:var(--rd);font-style:italic;margin:0 0 14px}.err{color:var(--rd);min-height:20px;font-size:14px}
footer{text-align:center;color:var(--mu);font-size:12px;padding:16px}
#app{display:none;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:230px;background:var(--br);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px;z-index:20;overflow:auto}
.side .brand{display:flex;gap:10px;align-items:center;margin-bottom:14px;font-weight:700;font-size:14px;line-height:1.2}.side .logo{width:44px;height:44px;font-size:15px;margin:0;flex:none;border-width:2px;border-color:#fff}
.nav{background:transparent;border:0;color:#f3e3d3;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer;font-size:15px}.nav.on{background:var(--go);color:#3a2616;font-weight:700}.nav:hover:not(.on){background:rgba(255,255,255,.1)}
.main{margin-left:230px;padding:18px}.top{display:none}
@media(max-width:900px),(orientation:portrait){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}.main{margin-left:0}.top{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:700;color:var(--br)}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.row .grow{flex:1;min-width:150px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{background:var(--br);color:#fff;text-align:left;padding:9px;white-space:nowrap}td{padding:8px 9px;border-bottom:1px solid var(--ln);white-space:nowrap}tr:nth-child(even) td{background:rgba(232,169,32,.07)}
.pill{padding:3px 10px;border-radius:20px;font-size:12px;color:#fff}.pill.in{background:var(--gr)}.pill.out{background:var(--rd)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid var(--ln);background:var(--cd);border-radius:20px;padding:6px 14px;cursor:pointer}.chip.on{background:var(--go);color:#3a2616;border-color:var(--go);font-weight:600}
.pos{display:grid;grid-template-columns:1fr 330px;gap:16px}@media(max-width:1000px),(orientation:portrait){.pos{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.item{border:1px solid var(--ln);border-left:5px solid var(--go);border-radius:12px;padding:10px;background:var(--cd);cursor:pointer;text-align:left}.item b{display:block}.item small{color:var(--mu)}.item.x{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}.stat{background:var(--cd);border:1px solid var(--ln);border-top:4px solid var(--go);border-radius:14px;padding:12px}.stat span{color:var(--mu);font-size:12px}.stat b{display:block;font-size:20px}
canvas{width:100%;height:280px;display:block}
dialog{border:0;border-radius:16px;padding:18px;width:min(440px,94vw);background:var(--cd);color:var(--tx)}dialog::backdrop{background:rgba(0,0,0,.45)}dialog label{display:block;font-size:13px;color:var(--mu);margin-top:8px}dialog input{width:100%}
.obl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.share{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;border-top:1px dashed var(--ln)}

<div class="main"><div class="top"><button class="btn sm" onclick="side.classList.toggle('open')">☰</button>BNH Convenient Store</div><div id="view"></div><footer>© 2026 BNH Convenient Store & trading. All rights reserved.</footer></div></div>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NAMES={bea:'Bea',nicole:'Nicole',hazel:'Hazel'},peso=n=>'₱'+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),dstr=t=>new Date(t).toLocaleDateString('en-US');
let db={inv:{bea:[],nicole:[],hazel:[]},sales:[],obl:[],pins:{},unlocked:{}};
try{const s=localStorage.getItem('bnh_db');if(s)db=Object.assign(db,JSON.parse(s))}catch(x){}
const save=()=>{try{localStorage.setItem('bnh_db',JSON.stringify(db))}catch(x){}};
let view='pos',cart=[],posInv='bea',posType='All',F={q:'',type:'',status:'',sel:new Set()},R={from:'',to:'',q:''},printAll=false;
function login(){if($('#u').value==='bnhAdmin2026'&&$('#p').value==='myBNH26'){try{sessionStorage.setItem('bnh_in','1')}catch(x){}enter()}else $('#le').textContent='Incorrect username or password.'}
function enter(){$('#login').style.display='none';$('#app').style.display='block';go('pos')}
function logout(){try{sessionStorage.removeItem('bnh_in')}catch(x){}$('#app').style.display='none';$('#login').style.display='flex';$('#u').value=$('#p').value='';$('#le').textContent=''}
document.querySelectorAll('.nav[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
document.addEventListener('keydown',x=>{if(x.key==='Enter'&&$('#login').style.display!=='none')login()});
function go(v){view=v;F={q:'',type:'',status:'',sel:new Set()};side.classList.remove('open');document.querySelectorAll('.nav[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render()}
function render(){
 if(NAMES[view]&&!db.unlocked[view]){return pinGate(view)}
 ({pos:rPos,report:rReport,obl:rObl}[view]||(()=>rInv(view)))()}
/* PIN */
function pinGate(k){const has=!!db.pins[k];$('#view').innerHTML=`<div class="card" style="max-width:380px;margin:40px auto;text-align:center"><h2>${NAMES[k]} Inventory</h2><p style="color:var(--mu)">${has?'Enter your 6-digit PIN to continue.':'First access: create a 6-digit PIN for this inventory.'}</p><input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" style="text-align:center;letter-spacing:8px;font-size:22px;width:100%">${has?'':'<input id="pin2" type="password" inputmode="numeric" maxlength="6" placeholder="Confirm PIN" style="text-align:center;letter-spacing:8px;font-size:22px;width:100%;margin-top:8px">'}<div class="err" id="pe"></div><button class="btn go" onclick="setPin('${k}')">${has?'Unlock':'Create PIN'}</button></div>`;$('#pin').focus()}
function setPin(k){const v=$('#pin').value,pe=$('#pe');if(!/^\d{6}$/.test(v))return pe.textContent='PIN must be exactly 6 digits.';
 if(!db.pins[k]){if(v!==$('#pin2').value)return pe.textContent='PINs do not match.';db.pins[k]=v}else if(v!==db.pins[k])return pe.textContent='Wrong PIN.';
 db.unlocked[k]=true;save();render()}
function changePin(k){dlg.innerHTML=`<h3>Change PIN</h3><label>Current PIN<input id="o" type="password" inputmode="numeric" maxlength="6"></label><label>New 6-digit PIN<input id="n" type="password" inputmode="numeric" maxlength="6"></label><div class="err" id="de"></div><div class="row"><button class="btn go" onclick="doPin('${k}')">Save</button><button class="btn ghost" onclick="dlg.close()">Cancel</button></div>`;dlg.showModal()}
function doPin(k){if($('#o').value!==db.pins[k])return $('#de').textContent='Current PIN is wrong.';if(!/^\d{6}$/.test($('#n').value))return $('#de').textContent='New PIN must be 6 digits.';db.pins[k]=$('#n').value;save();dlg.close()}
/* POS */
const types=k=>['All',...new Set(db.inv[k].map(p=>p.type).filter(Boolean))];
function rPos(){
 const list=db.inv[posInv].filter(p=>posType==='All'||p.type===posType);
 const tot=cart.reduce((s,c)=>s+c.qty*c.price,0);
 $('#view').innerHTML=`<h2>Dashboard (POS)</h2><div class="pos"><div><div class="card"><div class="chips">${Object.keys(NAMES).map(k=>`<button class="chip ${k===posInv?'on':''}" onclick="posInv='${k}';posType='All';render()">${NAMES[k]}</button>`).join('')}</div>
 <div class="chips">${types(posInv).map(t=>`<button class="chip ${t===posType?'on':''}" onclick="posType='${e(t).replace(/'/g,"\\'")}';render()">${e(t)}</button>`).join('')}</div>
 <input id="scan" class="grow" style="width:100%;margin-bottom:12px" placeholder="Scan barcode or type SKU, then Enter">
 <div class="grid">${list.map(p=>`<button class="item ${p.stock<1?'x':''}" onclick="addCart('${posInv}','${p.id}')"><b>${e(p.name)}</b><small>${e(p.type)||'—'} · ${p.stock} left</small><div style="color:var(--gr);font-weight:700">${peso(p.price)}</div></button>`).join('')||'<p style="color:var(--mu)">No products yet. Add some in the inventory page.</p>'}</div></div></div>
 <div class="card"><h3>Cart</h3>${cart.map((c,i)=>`<div class="share"><span>${e(c.name)}<br><small style="color:var(--mu)">${peso(c.price)}</small></span><span><button class="btn sm ghost" onclick="qty(${i},-1)">−</button> ${c.qty} <button class="btn sm ghost" onclick="qty(${i},1)">+</button></span></div>`).join('')||'<p style="color:var(--mu)">Cart is empty.</p>'}
 <h2 style="margin-top:12px">Total: ${peso(tot)}</h2><div class="row"><button class="btn gr grow" onclick="checkout()">Checkout</button><button class="btn ghost" onclick="cart=[];render()">Clear</button></div></div></div>`;
 $('#scan').onkeydown=x=>{if(x.key==='Enter'){const v=x.target.value.trim();let f=null;for(const k in NAMES){const p=db.inv[k].find(p=>p.barcode===v||p.sku===v);if(p){f=[k,p.id];break}}if(f)addCart(...f);else{x.target.value='';x.target.placeholder='Not found: '+v}}}}
function addCart(k,id){const p=db.inv[k].find(p=>p.id===id);if(!p||p.stock<1)return;const c=cart.find(c=>c.id===id&&c.inv===k);if(c){if(c.qty<p.stock)c.qty++}else cart.push({inv:k,id,name:p.name,qty:1,price:p.price,cost:p.cost});render();$('#scan')&&$('#scan').focus()}
function qty(i,d){const c=cart[i],p=db.inv[c.inv].find(p=>p.id===c.id);c.qty=Math.min(p.stock,c.qty+d);if(c.qty<1)cart.splice(i,1);render()}
function checkout(){if(!cart.length)return;cart.forEach(c=>{const p=db.inv[c.inv].find(p=>p.id===c.id);p.stock-=c.qty;p.sold+=c.qty});db.sales.push({t:Date.now(),items:cart.map(c=>({...c}))});cart=[];save();render();alert('Sale recorded.')}
/* Inventory */
const status=p=>p.stock>0?'Instock':'Sold Out';
function rInv(k){
 const all=db.inv[k],ty=[...new Set(all.map(p=>p.type).filter(Boolean))];
 const rows=all.filter(p=>printAll||((!F.q||(p.name+p.sku+p.barcode).toLowerCase().includes(F.q.toLowerCase()))&&(!F.type||p.type===F.type)&&(!F.status||status(p)===F.status)));
 $('#view').innerHTML=`<div class="row"><h2 style="margin:0" class="grow">${NAMES[k]} Inventory</h2><span class="noprint"><button class="btn ghost sm" onclick="changePin('${k}')">Change PIN</button></span></div>
 <div class="card"><div class="row noprint"><input class="grow" id="fq" placeholder="Search name, SKU, barcode" value="${e(F.q)}"><select id="ft"><option value="">All product types</option>${ty.map(t=>`<option ${F.type===t?'selected':''}>${e(t)}</option>`).join('')}</select><select id="fs"><option value="">All status</option>${['Instock','Sold Out'].map(t=>`<option ${F.status===t?'selected':''}>${t}</option>`).join('')}</select></div>
 <div class="row noprint"><button class="btn go" onclick="pform('${k}')">+ Add New Product</button><button class="btn ghost" onclick="doPrint('${k}')">🖨 Print</button>${F.sel.size?`<button class="btn rd" onclick="delSel('${k}')">Delete selected (${F.sel.size})</button>`:''}</div>
 <div class="wrap"><table><thead><tr><th class="noprint"><input type="checkbox" onchange="selAll('${k}',this.checked)"></th><th>#</th><th>Date</th><th>SKU</th><th>Product Name</th><th>Type</th><th>Starting</th><th>Instock</th><th>Sold</th><th>Barcode</th><th>Status</th><th class="noprint">Actions</th></tr></thead><tbody>
 ${rows.map((p,i)=>`<tr><td class="noprint"><input type="checkbox" ${F.sel.has(p.id)?'checked':''} onchange="tsel('${p.id}',this.checked,'${k}')"></td><td>${i+1}</td><td>${dstr(p.date)}</td><td>${e(p.sku)}</td><td>${e(p.name)}</td><td>${e(p.type)}</td><td>${p.start}</td><td>${p.stock}</td><td>${p.sold}</td><td>${e(p.barcode)}</td><td><span class="pill ${p.stock>0?'in':'out'}">${status(p)}</span></td><td class="noprint"><button class="btn sm go" onclick="pform('${k}','${p.id}')">Edit</button> <button class="btn sm rd" onclick="del('${k}','${p.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="12" style="text-align:center;color:var(--mu)">No products found.</td></tr>'}</tbody></table></div></div>`;
 const rr=()=>{const f=document.activeElement.id==='fq';render();if(f){const q=$('#fq');q.focus();q.setSelectionRange(99,99)}};

function psave(k,id){const g=i=>$('#'+i).value.trim(),n=g('f_n');if(!n)return $('#de').textContent='Product name is required.';const st=Math.max(0,parseInt(g('f_st'))||0);

/* Report */
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
function preset(m){const n=new Date(),d=new Date(n);let a=new Date(n);if(m==='w')a.setDate(n.getDate()-6);if(m==='q')a=new Date(n.getFullYear(),Math.floor(n.getMonth()/3)*3,1);if(m==='y')a=new Date(n.getFullYear(),0,1);R.from=iso(a);R.to=iso(d);render()}
function rReport(){
 if(!R.from)return preset('w');
 const a=new Date(R.from+'T00:00:00').getTime(),b=new Date(R.to+'T23:59:59').getTime(),days=(b-a)/864e5,q=R.q.toLowerCase();
 const S=db.sales.filter(s=>s.t>=a&&s.t<=b).map(s=>({...s,items:s.items.filter(i=>!q||i.name.toLowerCase().includes(q))})).filter(s=>s.items.length);
 const g=days<=1?'h':days<=45?'d':'m',B={};let rev=0,cost=0,qtys={};
 S.forEach(s=>{const d=new Date(s.t),k=g==='h'?d.getHours():g==='d'?iso(d):iso(d).slice(0,7);B[k]=B[k]||{s:0,c:0};s.items.forEach(i=>{B[k].s+=i.qty*i.price;B[k].c+=i.qty*i.cost;rev+=i.qty*i.price;cost+=i.qty*i.cost;qtys[i.name]=(qtys[i.name]||0)+i.qty})});
 const ks=Object.keys(B).sort(),prof=rev-cost,roi=cost?prof/cost*100:0;
 const top=Object.entries(qtys).sort((x,y)=>y[1]-x[1]).slice(0,5),out=Object.keys(NAMES).flatMap(k=>db.inv[k].filter(p=>p.stock<1).map(p=>({...p,k})));
 window._ch={ks,s:ks.map(k=>B[k].s),p:ks.map(k=>B[k].s-B[k].c),r:ks.map(k=>B[k].c?(B[k].s-B[k].c)/B[k].c*100:0)};
 $('#view').innerHTML=`<h2>Report</h2><div class="card"><div class="row noprint"><input class="grow" id="rq" placeholder="Search item in sales" value="${e(R.q)}"><label>From <input type="date" id="rf" value="${R.from}"></label><label>To <input type="date" id="rt" value="${R.to}"></label></div>
 <div class="row noprint">${[['d','Daily'],['w','Weekly'],['q','Quarterly'],['y','Annual']].map(([m,l])=>`<button class="btn go sm" onclick="preset('${m}')">${l}</button>`).join('')}<button class="btn ghost sm" onclick="window.print()">🖨 Print / Save PDF</button></div>
 <div class="stats"><div class="stat"><span>Sales</span><b>${peso(rev)}</b></div><div class="stat" style="border-top-color:var(--gr)"><span>Profit</span><b>${peso(prof)}</b></div><div class="stat" style="border-top-color:var(--bl)"><span>ROI</span><b>${roi.toFixed(1)}%</b></div><div class="stat" style="border-top-color:var(--rd)"><span>Transactions</span><b>${S.length}</b></div></div>
 <canvas id="cv"></canvas></div>
 <div class="card"><h3>Top 5 Most Purchased Items</h3><div class="wrap"><table><thead><tr><th>#</th><th>Item</th><th>Qty Sold</th></tr></thead><tbody>${top.map((t,i)=>`<tr><td>${i+1}</td><td>${e(t[0])}</td><td>${t[1]}</td></tr>`).join('')||'<tr><td colspan="3" style="color:var(--mu)">No sales in this range.</td></tr>'}</tbody></table></div></div>
 <div class="card"><h3>Sold Out Items</h3><div class="wrap"><table><thead><tr><th>Inventory</th><th>SKU</th><th>Item</th><th>Type</th></tr></thead><tbody>${out.map(p=>`<tr><td>${NAMES[p.k]}</td><td>${e(p.sku)}</td><td>${e(p.name)}</td><td>${e(p.type)}</td></tr>`).join('')||'<tr><td colspan="4" style="color:var(--mu)">Nothing is sold out.</td></tr>'}</tbody></table></div></div>`;
 $('#rf').onchange=x=>{R.from=x.target.value;render()};$('#rt').onchange=x=>{R.to=x.target.value;render()};$('#rq').onchange=x=>{R.q=x.target.value;render()};draw()}
function draw(){const c=$('#cv');if(!c||!window._ch)return;const D=window._ch,r=devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;c.width=W*r;c.height=H*r;const x=c.getContext('2d');x.scale(r,r);
 const cs=getComputedStyle(document.body),tx=cs.color,pad=46,n=D.ks.length;x.font='11px system-ui';x.fillStyle=tx;x.strokeStyle='rgba(128,128,128,.25)';
 if(!n){x.textAlign='center';x.fillText('No data for this range',W/2,H/2);return}
 const mx=Math.max(1,...D.s,...D.p),mr=Math.max(1,...D.r.map(Math.abs)),X=i=>n===1?W/2:pad+i*(W-2*pad)/(n-1),Y=(v,m)=>H-28-(v/m)*(H-50);
 for(let i=0;i<=4;i++){const y=H-28-i*(H-50)/4;x.beginPath();x.moveTo(pad,y);x.lineTo(W-pad,y);x.stroke();x.textAlign='right';x.fillText(Math.round(mx*i/4),pad-4,y+3);x.textAlign='left';x.fillText(Math.round(mr*i/4)+'%',W-pad+4,y+3)}
 x.textAlign='center';D.ks.forEach((k,i)=>{if(n<12||i%Math.ceil(n/10)===0)x.fillText(String(k).replace(/^\d{4}-/,''),X(i),H-10)});
 [[D.s,'#e8a920',mx,[]],[D.p,'#3f8f4f',mx,[]],[D.r,'#2f6fb0',mr,[5,4]]].forEach(([a,col,m,dash])=>{x.strokeStyle=col;x.fillStyle=col;x.lineWidth=2.5;x.setLineDash(dash);x.beginPath();a.forEach((v,i)=>i?x.lineTo(X(i),Y(v,m)):x.moveTo(X(i),Y(v,m)));x.stroke();x.setLineDash([]);a.forEach((v,i)=>{x.beginPath();x.arc(X(i),Y(v,m),3,0,7);x.fill()})});
 x.textAlign='left';[['Sales','#e8a920'],['Profit','#3f8f4f'],['ROI % (right axis)','#2f6fb0']].forEach(([l,col],i)=>{x.fillStyle=col;x.fillRect(pad+i*100,4,10,10);x.fillStyle=tx;x.fillText(l,pad+i*100+14,13)})}
addEventListener('resize',()=>{if(view==='report')draw()});addEventListener('orientationchange',()=>setTimeout(()=>{if(view==='report')draw()},300));
